namespace: devplatform

replicas:
  api: 1
  web: 1
  redis: 1

image:
  repository: ghcr.io/2005mohit
  tag: 3af6682
  pullPolicy: IfNotPresent

serviceAccount: devplatform-sa

dbSecret: db-credentials
gitSecret: github-pat

api:
  port: 8080
  env:
    REDIS_ADDR: redis:6379
    BASE_DOMAIN: 35.175.60.72.sslip.io
    REGISTRY: ghcr.io/2005mohit
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

web:
  port: 3000
  env:
    NEXT_PUBLIC_API_URL: http://api:8080
    NEXT_PUBLIC_WS_URL: ws://api:8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 400Mi

redis:
  image: redis:7-alpine

ingress:
  enabled: true
  className: nginx
  host: 35.175.60.72.sslip.io
  tls:
    enabled: true
    secretName: devplatform-tls
