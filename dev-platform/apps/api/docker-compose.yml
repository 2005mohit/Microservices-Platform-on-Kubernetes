services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devplatform
      POSTGRES_USER: devplatform
      POSTGRES_PASSWORD: devplatform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - devplatform

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - devplatform

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://devplatform:devplatform@postgres:5432/devplatform?sslmode=disable
      REDIS_ADDR: redis:6379
      PORT: "8080"
    depends_on:
      - postgres
      - redis
    networks:
      - devplatform

  frontend:
    build: ../web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - api
    networks:
      - devplatform

volumes:
  pgdata:

networks:
  devplatform: