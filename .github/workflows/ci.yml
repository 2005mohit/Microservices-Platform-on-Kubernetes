name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: dev-platform/apps/api/go.mod
          cache-dependency-path: dev-platform/apps/api/go.sum

      - name: Go vet + build
        working-directory: dev-platform/apps/api
        run: |
          go vet ./...
          go build ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dev-platform/apps/web/package-lock.json

      - name: Web lint + build
        working-directory: dev-platform/apps/web
        env:
          NEXT_PUBLIC_API_URL: /api
        run: |
          npm ci
          npm run lint
          npm run build

  build-and-push:
    name: Build / Scan / Push
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: dev-platform/apps/${{ matrix.service }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: devplatform-${{ matrix.service }}:ci
          build-args: |
            NEXT_PUBLIC_API_URL=/api

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devplatform-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: dev-platform/apps/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devplatform-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/devplatform-${{ matrix.service }}:${{ github.sha }}

  update-gitops:
    name: Bump image tag (ArgoCD)
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Bump image tag in values.yaml
        run: |
          sed -i "s/^  tag: .*/  tag: ${{ steps.sha.outputs.short }}/" kubernetes/helm-chart/devplatform/values.yaml

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump devplatform image tag to ${{ steps.sha.outputs.short }} [skip ci]"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
