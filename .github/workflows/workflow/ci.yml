name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build / Scan / Push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: dev-platform/apps/${{ matrix.service }}
          load: true
          tags: devplatform-${{ matrix.service }}:ci
          build-args: |
            NEXT_PUBLIC_API_URL=/api
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: devplatform-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Push to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: dev-platform/apps/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devplatform-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/devplatform-${{ matrix.service }}:${{ github.sha }}